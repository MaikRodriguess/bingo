<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161412">
  <title>Bingo</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="player">
  <h1 id="title">Bingo</h1>

  <section id="invalid" class="panel hidden">
    <h2>Link inválido</h2>
    <p style="margin:0">Esta cartela não existe ou foi removida. Peça um novo link ao organizador.</p>
  </section>

  <section id="join" class="panel hidden">
    <h2>Entrar no jogo</h2>
    <form id="joinForm">
      <input id="name" type="text" maxlength="40" placeholder="Seu nome" autocomplete="nickname" required>
      <button type="submit">Pegar cartela</button>
    </form>
    <div id="joinError" class="error"></div>
  </section>

  <section id="game" class="hidden">
    <!-- Barra fixa no topo: último número sempre visível enquanto rola a tela -->
    <div class="livebar">
      <div id="ball" class="ball ball-sm">–</div>
      <div class="livebar-info">
        <strong>Último número</strong>
        <span id="drawCount" class="muted"></span>
        <span id="status" class="status">conectando</span>
      </div>
    </div>

    <div id="banner" class="banner hidden"></div>

    <div class="layout">
      <div class="panel">
        <div id="card" class="card"></div>
        <p id="cardInfo" class="center muted" style="margin:12px 0 0"></p>
      </div>
      <div>
        <div class="panel">
          <h2>Já sorteados</h2>
          <div id="history" class="history"></div>
        </div>
        <div class="panel">
          <h2>Vencedores</h2>
          <ul id="winners" class="list"><li class="muted">Ninguém ainda.</li></ul>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="/live.js"></script>
<script>
const LETTERS = 'BINGO';
const letterOf = n => LETTERS[Math.floor((n - 1) / 15)];
const $ = id => document.getElementById(id);

let card = null;          // { id, ref, name, grid, round }
let cellByNumber = {};    // número -> célula da cartela (para atualizar só o que mudou)
let shown = [];           // números já mostrados no histórico
let lastState = null;
let winnersKey = null;

// Cartela aberta por link (/cartela/<id>) tem prioridade sobre a salva no navegador
const linkMatch = location.pathname.match(/^\/cartela\/([0-9a-f-]{36})$/);
const linkId = linkMatch ? linkMatch[1] : null;

function storedId() { try { return localStorage.getItem('bingoCardId'); } catch { return null; } }
function storeId(id) { try { id ? localStorage.setItem('bingoCardId', id) : localStorage.removeItem('bingoCardId'); } catch {} }

async function loadCard(id) {
  let r;
  try { r = await fetch('/api/card/' + id); } catch { setTimeout(() => loadCard(id), 3000); return; }
  if (!r.ok) {
    card = null;
    if (linkId) { $('invalid').classList.remove('hidden'); $('game').classList.add('hidden'); return; }
    storeId(null); showJoin(); return;
  }
  card = await r.json();
  showGame();
}

function showJoin() { $('join').classList.remove('hidden'); $('game').classList.add('hidden'); }

function showGame() {
  $('join').classList.add('hidden');
  $('invalid').classList.add('hidden');
  $('game').classList.remove('hidden');
  $('title').textContent = card.name;
  $('title').className = 'player-name';
  document.title = card.name + ' · Bingo';
  buildCard();
  keepScreenOn();
  if (lastState) render(lastState, false);
}

$('joinForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('joinError').textContent = '';
  const r = await fetch('/api/join', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: $('name').value })
  });
  const data = await r.json();
  if (!r.ok) { $('joinError').textContent = data.error; return; }
  card = data; storeId(card.id); showGame();
});

// Monta a cartela uma única vez; depois só troca classes das células
function buildCard() {
  const el = $('card');
  const frag = document.createDocumentFragment();
  cellByNumber = {};
  for (const l of LETTERS) {
    const h = document.createElement('div'); h.className = 'head'; h.textContent = l; frag.appendChild(h);
  }
  for (const row of card.grid) for (const n of row) {
    const c = document.createElement('div');
    c.className = 'cell';
    if (n === 0) { c.classList.add('marked', 'free'); c.textContent = '★'; }
    else { c.textContent = n; cellByNumber[n] = c; }
    frag.appendChild(c);
  }
  el.replaceChildren(frag);
}

function updateCard(drawnSet, newly) {
  let hits = 0, gotNew = false;
  for (const n in cellByNumber) {
    const on = drawnSet.has(+n);
    const c = cellByNumber[n];
    if (on) hits++;
    if (c.classList.contains('marked') !== on) {
      c.classList.toggle('marked', on);
      if (on && newly.has(+n)) { c.classList.add('just'); gotNew = true; }
    }
  }
  $('cardInfo').textContent = hits + ' de 24 números marcados';
  if (gotNew && navigator.vibrate) navigator.vibrate(120);
}

function chip(n) {
  const ch = document.createElement('span'); ch.className = 'chip'; ch.textContent = letterOf(n) + ' ' + n; return ch;
}

function updateHistory(drawn) {
  const hist = $('history');
  // Reinício de rodada ou primeira carga: refaz; senão só adiciona os novos no começo
  const continues = shown.length <= drawn.length && shown.every((n, i) => n === drawn[i]);
  if (!continues || !hist.firstChild || hist.firstChild.classList?.contains('muted')) {
    hist.replaceChildren(...[...drawn].reverse().map(chip));
  } else {
    for (const n of drawn.slice(shown.length)) hist.prepend(chip(n));
  }
  if (!drawn.length) hist.innerHTML = '<span class="muted">Aguardando o primeiro sorteio…</span>';
  shown = drawn.slice();
}

function updateWinners(winners) {
  const key = winners.map(w => w.ref + w.type).join('|');
  if (key === winnersKey) return;
  winnersKey = key;
  const w = $('winners');
  if (!winners.length) { w.innerHTML = '<li class="muted">Ninguém ainda.</li>'; return; }
  w.replaceChildren(...winners.map(win => {
    const li = document.createElement('li');
    const a = document.createElement('strong'); a.textContent = win.name;
    const b = document.createElement('span'); b.className = 'muted'; b.textContent = win.type + (win.number ? ' · no ' + win.number : '');
    li.append(a, b); return li;
  }));
}

function render(s, animate = true) {
  const prev = new Set(lastState && lastState.round === s.round ? lastState.drawn : s.drawn);
  const newly = animate ? new Set(s.drawn.filter(n => !prev.has(n))) : new Set();
  lastState = s;

  const ball = $('ball');
  if (s.last) {
    ball.innerHTML = '<div><small>' + letterOf(s.last) + '</small>' + s.last + '</div>';
    if (newly.has(s.last)) { ball.classList.remove('pop'); void ball.offsetWidth; ball.classList.add('pop'); }
  } else ball.textContent = '–';
  $('drawCount').textContent = s.drawn.length + ' sorteados · ' + s.remaining + ' restantes';

  updateHistory(s.drawn);
  updateWinners(s.winners);

  if (!card) return;
  if (card.round !== s.round) { loadCard(card.id); return; } // nova rodada: cartela nova
  updateCard(new Set(s.drawn), newly);

  const mine = s.winners.filter(x => x.ref === card.ref).map(x => x.type);
  const banner = $('banner');
  if (mine.length) {
    const text = '🎉 BINGO! Você fez ' + mine.join(' e ') + '!';
    if (banner.textContent !== text && navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
    banner.textContent = text; banner.classList.remove('hidden');
  } else banner.classList.add('hidden');
}

const id = linkId || storedId();
if (id) loadCard(id); else showJoin();
connectLive(s => render(s), $('status'));
</script>
</body>
</html>
